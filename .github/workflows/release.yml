name: release

# Push a tag such as v0.1.0 to build, test and publish the portable Windows zip as a GitHub
# Release. Nothing is published from branch pushes or pull requests (see ci.yml for those).
# Third-party actions are pinned to full commit SHAs (the tag is in the comment).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build a zip for (artifact only, no release is created)"
        required: true

permissions:
  contents: read # the build job never needs more; only `publish` gets write access

jobs:
  windows-package:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-python

      - name: Point the toolchain file at this MSYS2 install
        shell: msys2 {0}
        run: echo "MSYS2_ROOT=$(cygpath -m /)" >> "$GITHUB_ENV"

      - name: Check the tag matches the project version
        shell: pwsh
        run: |
          $v = (Select-String -Path CMakeLists.txt -Pattern 'project\s*\([^)]*VERSION\s+([0-9][0-9.]*)').Matches[0].Groups[1].Value
          if ($env:TAG.TrimStart('v') -ne $v) {
            throw "Tag $env:TAG does not match the CMake project version $v"
          }

      # Release build, ctest --preset release, zip, then a clean-PATH extraction test.
      - name: Build, test and package
        shell: pwsh
        run: ./tools/package_release.ps1 -Version "$env:TAG" -SoftwareRender

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mmsim-win64
          path: |
            dist/mmsim-*-win64.zip
            dist/mmsim-*-win64.zip.sha256
          if-no-files-found: error

  publish:
    # Only for real tag pushes (not workflow_dispatch). The only job with a write token.
    if: github.event_name == 'push'
    needs: windows-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mmsim-win64
          path: dist

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" dist/mmsim-*-win64.zip dist/mmsim-*-win64.zip.sha256 \
            --title "MMSim $TAG" --generate-notes
